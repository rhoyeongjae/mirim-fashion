<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>미림패션쇼 - 랭킹</title>
    <link rel="stylesheet" href="../css/ranking.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <script src="../js/common.js" defer></script>
    <script src="../js/ranking.js" defer></script>
  </head>
  <body>
    <main class="rank-page">
      <h1>패션 랭킹 <span>TOP 5</span></h1>
      <p class="description">서버에 저장된 AI 평가 점수 순위</p>
      <p id="ranking-status" class="ranking-note" role="status"></p>
      <ol id="rank-list" class="rank-list" aria-label="서버 순위"></ol>
      <h2>이 브라우저의 연습 기록</h2>
      <ol id="local-rank-list" class="rank-list" aria-label="브라우저 연습 순위"></ol>
      <div class="button-row">
        <button id="clear-records" type="button" onclick="clearRecords()">연습 기록 삭제</button
        ><a class="home-button" href="home.html">홈으로 →</a>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
