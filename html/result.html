<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>미림패션쇼 - 결과</title>
    <link rel="stylesheet" href="../css/result.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <script src="../js/common.js" defer></script>
    <script src="../js/character.js" defer></script>
    <script src="../js/result.js" defer></script>
  </head>
  <body>
    <header class="top">
      <a href="design.html">← 다시 꾸미기</a><b>미림패션쇼</b
      ><a href="home.html">홈으로</a>
    </header>
    <main class="results">
      <section class="preview finished">
        <h1 id="result-name">완성된 코디</h1>
        <canvas
          id="result-model"
          width="420"
          height="560"
          aria-label="완성된 코디 이미지"
        ></canvas>
        <p id="outfit-summary" class="hint"></p>
      </section>
      <section class="details">
        <div class="score-box">
          <h2>내 코디 평가</h2>
          <p class="practice-label">AI 코디 평가</p>
          <p class="score"><span id="score">—</span> <small>/ 100점</small></p>
          <div class="evaluation">
            <h3>코디 한마디</h3>
            <p id="evaluation" aria-live="polite">
              AI 평가를 눌러 내 코디의 점수를 확인해보세요.
            </p>
          </div>
          <button id="evaluate-outfit" type="button" onclick="evaluateOutfit()">AI 평가하기</button>
        </div>
        <div class="record-form">
          <label for="record-name">기록할 이름</label
          ><input
            id="record-name"
            maxlength="20"
            placeholder="이름 또는 별명"
          /><button id="save-record" type="button" disabled onclick="saveRecord()">
            연습 랭킹에 저장</button
          ><a href="ranking.html">연습 랭킹 보기</a>
        </div>
        <div class="result-buttons">
          <button id="download" type="button" onclick="downloadImage()">이미지 다운로드</button
          ><button id="show-code" type="button" onclick="shareCode()">코드 공유</button
          ><a href="home.html">홈으로</a>
        </div>
      </section>
    </main>
    <section id="share-box" class="saved-panel" hidden>
      <h2>코디 공유 코드</h2>
      <p>코드에 얼굴 사진과 그림도 포함돼요. 공유할 대상을 확인해주세요.</p>
      <label for="share-code">꾸미기 화면에서 붙여넣을 코드</label
      ><textarea id="share-code" rows="4" readonly></textarea
      ><button id="copy-code" type="button" onclick="copyCode()">코드 복사</button>
    </section>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </body>
</html>
